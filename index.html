<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --chiikawa-pink: #ffdae0;
            --hachiware-blue: #dceefc;
            --usagi-yellow: #fff8bd;
            --momonga-orange: #ffe4c4;
            --dark-text: #6b5b5b;
            --input-border: #ffb7c5;
        }

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: linear-gradient(135deg, #fff0f5 0%, #e6f7ff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--dark-text);
            background-image: radial-gradient(#ffffff 20%, transparent 20%), radial-gradient(#ffffff 20%, transparent 20%);
            background-position: 0 0, 20px 20px;
            background-size: 40px 40px;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(255, 183, 197, 0.3);
            width: 90%;
            max-width: 550px;
            text-align: center;
            border: 5px solid white;
            position: relative;
            overflow: hidden;
        }

        h1 {
            color: #ff8ba7;
            font-size: 26px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 0px #fff;
        }

        p { color: #8d8d8d; font-weight: bold; font-size: 14px; margin-bottom: 20px; }

        /* 輸入名字的欄位 */
        .name-input-group {
            margin-bottom: 20px;
            text-align: left;
            background: #fff;
            padding: 15px;
            border-radius: 20px;
            border: 2px dashed var(--input-border);
        }
        
        .name-input-label {
            display: block;
            margin-bottom: 8px;
            color: #ff8ba7;
            font-weight: bold;
        }

        #player-name {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 12px;
            font-size: 16px;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        #player-name:focus {
            border-color: var(--chiikawa-pink);
        }

        /* 首頁選單樣式 */
        .menu-grid {
            display: grid;
            gap: 15px;
        }

        .menu-btn {
            background-color: white;
            border: 3px solid var(--chiikawa-pink);
            color: var(--dark-text);
            padding: 15px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            box-shadow: 0 5px 0 var(--chiikawa-pink);
        }

        .menu-btn:hover {
            transform: translateY(-5px);
            background-color: var(--chiikawa-pink);
            color: white;
            border-color: #ffb7c5;
        }

        .menu-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 var(--chiikawa-pink);
        }

        .menu-btn.secondary {
            border-color: var(--hachiware-blue);
            box-shadow: 0 5px 0 var(--hachiware-blue);
        }
        .menu-btn.secondary:hover { background-color: var(--hachiware-blue); border-color: #badcf5; }

        .menu-btn.rank-btn {
            border-color: #ffd700;
            box-shadow: 0 5px 0 #ffd700;
            background: #fffdf0;
        }
        .menu-btn.rank-btn:hover { background-color: #ffd700; color: #fff; border-color: #e6c200; }

        .btn-icon { font-size: 28px; }

        /* 頂部導航欄 */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f8f9fa;
            padding: 8px 15px;
            border-radius: 20px;
            margin-bottom: 15px;
            border: 2px solid #eee;
        }

        .mini-btn {
            background-color: white;
            border: 2px solid #ddd;
            color: var(--dark-text);
            padding: 5px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.2s;
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }
        .mini-btn:hover { background-color: #eee; }

        .stats-info { font-size: 14px; color: #888; font-weight: bold; }

        /* 題目框框 */
        .question-box {
            font-size: 22px;
            font-weight: bold;
            color: #6b5b5b;
            margin: 15px 0;
            padding: 20px;
            background-color: var(--usagi-yellow);
            border-radius: 25px;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px dashed #ffe082;
            position: relative;
        }

        /* 選項按鈕 */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }

        button.option-btn {
            background-color: white;
            border: 2px solid #e0e0e0;
            border-radius: 18px;
            padding: 12px 15px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--dark-text);
            text-align: left;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-weight: bold;
        }

        button.option-btn:hover:not(:disabled) {
            background-color: #f8f9fa;
            border-color: var(--hachiware-blue);
            transform: scale(1.02);
        }

        button.option-btn.correct { background-color: #d4edda; border-color: #28a745; color: #155724; }
        button.option-btn.wrong { background-color: #f8d7da; border-color: #dc3545; color: #721c24; animation: shake 0.4s; }

        /* 導航按鈕區 */
        .quiz-nav-area {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            height: 50px; 
        }

        .nav-btn {
            padding: 12px 25px;
            background-color: var(--chiikawa-pink);
            color: #6b5b5b;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            min-width: 100px;
        }

        .nav-btn:hover { transform: scale(1.05); filter: brightness(0.95); }
        .prev-btn { background-color: #e0e0e0; color: #7f8c8d; }

        /* 排行榜樣式 */
        .ranking-list {
            text-align: left;
            margin: 10px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        .rank-item {
            background: #fff;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
        }
        .rank-badge {
            width: 25px;
            height: 25px;
            background: #ddd;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            margin-right: 10px;
            font-weight: bold;
        }
        .rank-1 .rank-badge { background: #ffd700; color: #fff; }
        .rank-2 .rank-badge { background: #c0c0c0; color: #fff; }
        .rank-3 .rank-badge { background: #cd7f32; color: #fff; }

        .btn-group { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        .home-btn { background-color: #b2bec3; color: white; }
        .retry-all-btn { background-color: var(--hachiware-blue); }
        .review-btn { background-color: #ff9f43; color: white; border: 2px solid #ff9f43; animation: pulse 2s infinite; }
        
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .score-display { font-size: 48px; color: #ff8ba7; margin: 15px 0; font-weight: 800; }
        .cute-decoration { font-size: 40px; margin-bottom: -10px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    </style>
</head>
<body>

<div class="container">
    
    <div id="home-screen" class="screen active">
        <div class="cute-decoration">🐹✨</div>
        <h1>吉伊卡哇英語教室</h1>
        <p>準備好一起討伐單字了嗎？</p>
        
        <div class="name-input-group">
            <label class="name-input-label">請輸入你的名字：</label>
            <input type="text" id="player-name" placeholder="例如：吉伊卡哇" maxlength="10">
        </div>

        <div class="menu-grid">
            <button class="menu-btn" onclick="startQuiz('vocab')">
                <span class="btn-icon">📝</span>
                <div style="text-align:left">
                    <div style="font-weight:bold">110 單字挑戰</div>
                    <div style="font-size:12px; opacity:0.7">配對正確的中文</div>
                </div>
            </button>
            <button class="menu-btn secondary" onclick="startQuiz('paper')">
                <span class="btn-icon">📄</span>
                <div style="text-align:left">
                    <div style="font-weight:bold">測驗卷複習</div>
                    <div style="font-size:12px; opacity:0.7">文法與填充題</div>
                </div>
            </button>
            <button class="menu-btn rank-btn" onclick="showFirebaseLeaderboard()">
                <span class="btn-icon">🏆</span>
                <div style="text-align:left">
                    <div style="font-weight:bold">世界排行榜</div>
                    <div style="font-size:12px; opacity:0.7">看看誰是第一名</div>
                </div>
            </button>
        </div>
    </div>

    <div id="quiz-screen" class="screen">
        <div class="quiz-header">
            <button class="mini-btn" onclick="confirmHome()">🏠 首頁</button>
            <div class="stats-info">
                <span id="player-display" style="color:#ff8ba7; margin-right:5px;"></span>
                <span id="progress-text">1 / 10</span> &nbsp;|&nbsp; 
                <span id="score-text">Score: 0</span>
            </div>
        </div>
        
        <div class="question-box">
            <span id="question-display">Loading...</span>
            <span style="position:absolute; top:-15px; right:-10px; font-size:24px;">🐰</span>
        </div>
        
        <div class="options-grid" id="options-container">
            </div>

        <div class="quiz-nav-area">
            <button class="nav-btn prev-btn" id="prev-btn" style="visibility:hidden" onclick="prevQuestion()">
                ⬅ 上一題
            </button>
            <button class="nav-btn" id="next-btn" style="visibility:hidden" onclick="nextQuestion()">
                下一題 ➡
            </button>
        </div>
    </div>

    <div id="result-screen" class="screen">
        <div class="cute-decoration">🎊</div>
        <h1>討伐完成!</h1>
        <p id="result-player-name" style="margin-bottom:0">玩家</p>
        <div class="score-display" id="final-score">0 / 0</div>
        <p id="feedback-msg" style="font-size: 16px; color: #6b5b5b;"></p>
        <p id="save-msg" style="font-size: 14px; color: #aaa; margin-top:-10px;">正在上傳成績...</p>
        
        <div class="btn-group">
            <button class="nav-btn review-btn" id="review-btn" onclick="startReviewMode()" style="display:none">
                🐹 重做錯題
            </button>
            <button class="nav-btn retry-all-btn" onclick="restartCurrentQuiz()">
                🔄 全部重來
            </button>
            <button class="nav-btn home-btn" onclick="goHome()">
                🏠 回首頁
            </button>
        </div>
    </div>

    <div id="leaderboard-screen" class="screen">
        <div class="cute-decoration">🏆</div>
        <h1>世界排行榜</h1>
        <p>連線同步中...</p>
        
        <div class="ranking-list" id="ranking-container">
            <p style="text-align:center">載入中，請稍候... 🐹</p>
        </div>

        <button class="nav-btn home-btn" onclick="goHome()">
            ⬅ 返回首頁
        </button>
    </div>

</div>

<script type="module">
    // 1. 引入 Firebase 函式庫
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

    // 2. 設定 Firebase (這裡已經幫你填好了！)
    // =========================================================
    const firebaseConfig = {
      apiKey: "AIzaSyBlt_wWG_WuxOQGP-NU0jYOiBIBcDBd1EU",
      authDomain: "english-quiz-sem1.firebaseapp.com",
      projectId: "english-quiz-sem1",
      storageBucket: "english-quiz-sem1.firebasestorage.app",
      messagingSenderId: "618594638432",
      appId: "1:618594638432:web:5183263ccd8fac0869c105"
    };
    // =========================================================

    // 3. 初始化 Firebase
    let db;
    try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        console.log("Firebase 連線成功！");
    } catch (e) {
        console.error("Firebase 連線失敗 (請檢查 Config)", e);
    }

    // 將 Firebase 功能掛載到 window 物件，讓原本的 JS 可以呼叫
    window.uploadScore = async function(name, score, total, mode) {
        if (!db) return;
        try {
            const docRef = await addDoc(collection(db, "leaderboard"), {
                name: name,
                score: score,
                total: total,
                mode: mode === 'vocab' ? '單字' : (mode === 'paper' ? '測驗卷' : '複習'),
                createdAt: serverTimestamp() // 紀錄伺服器時間
            });
            console.log("成績上傳成功, ID: ", docRef.id);
            document.getElementById('save-msg').innerText = "成績已上傳至雲端！☁️";
        } catch (e) {
            console.error("上傳失敗: ", e);
            document.getElementById('save-msg').innerText = "上傳失敗，請檢查網路 🥺";
        }
    };

    window.fetchLeaderboard = async function() {
        const container = document.getElementById('ranking-container');
        if (!db) {
            container.innerHTML = '<p style="text-align:center">請先設定 Firebase Config 喔！</p>';
            return;
        }

        try {
            // 查詢：依照分數高到低排序，取前 50 名
            const q = query(collection(db, "leaderboard"), orderBy("score", "desc"), limit(50));
            const querySnapshot = await getDocs(q);
            
            container.innerHTML = '';
            let index = 0;
            
            if (querySnapshot.empty) {
                container.innerHTML = '<p style="text-align:center">目前還沒有紀錄，快去挑戰當第一名！</p>';
                return;
            }

            querySnapshot.forEach((doc) => {
                index++;
                const rec = doc.data();
                
                let rankClass = '';
                if (index === 1) rankClass = 'rank-1';
                else if (index === 2) rankClass = 'rank-2';
                else if (index === 3) rankClass = 'rank-3';

                const item = document.createElement('div');
                item.className = `rank-item ${rankClass}`;
                item.innerHTML = `
                    <div style="display:flex; align-items:center;">
                        <span class="rank-badge">${index}</span>
                        <div>
                            <div style="font-weight:bold; color:#555">${rec.name}</div>
                            <div style="font-size:12px; color:#999">${rec.mode}</div>
                        </div>
                    </div>
                    <div style="font-weight:bold; color:#ff8ba7; font-size:18px;">
                        ${rec.score} <span style="font-size:12px; color:#aaa">/ ${rec.total}</span>
                    </div>
                `;
                container.appendChild(item);
            });

        } catch (e) {
            console.error("讀取失敗: ", e);
            container.innerHTML = '<p style="text-align:center">無法讀取排行榜 (請確認已開啟測試模式)</p>';
        }
    }
</script>

    ];

    const paperList = [
        { q: "My father gave me ______ good advice on finding a job.", options: ["some", "many", "an", "few"], ans: "some" },
        { q: "How ______ gifts did you receive last Christmas?", options: ["many", "much", "any", "little"], ans: "many" },
        { q: "Tom doesn't have ______ money on him.", options: ["much", "many", "some", "a"], ans: "much" },
        { q: "There aren't ______ desks in the classroom.", options: ["any", "some", "much", "none"], ans: "any" },
        { q: "Our parents never ______ (smoke) in front of us.", options: ["smoke", "smokes", "smoking", "smoked"], ans: "smoke" },
        { q: "The students sometimes ______ (not pay) attention to their teacher.", options: ["don't pay", "doesn't pay", "not pay", "aren't pay"], ans: "don't pay" },
        { q: "We ______ (go) to France for two months last year.", options: ["went", "go", "gone", "going"], ans: "went" },
        { q: "______ (be) your wife a doctor?", options: ["Is", "Are", "Does", "Do"], ans: "Is" },
        { q: "Yes, she ______ (be).", options: ["is", "are", "does", "has"], ans: "is" },
        { q: "______ people we met last night were really helpful.", options: ["Those", "That", "This", "They"], ans: "Those" },
        { q: "Look at ______ pictures over there.", options: ["those", "these", "this", "that"], ans: "those" },
        { q: "The firefighter who saved three children is a real ______.", options: ["hero", "male", "idol", "truthful"], ans: "hero" },
        { q: "Illegal ______ are sent back across the border if caught.", options: ["immigrants", "idols", "humans", "tourists"], ans: "immigrants" },
        { q: "Remember to put an address ______ on the suitcase.", options: ["label", "liberal", "intuition", "paper"], ans: "label" },
        { q: "She worked very hard to ______ her fear of speaking.", options: ["overcome", "priority", "polite", "motive"], ans: "overcome" },
        { q: "In Africa, many families live in ______.", options: ["poverty", "refugee", "pity", "wealth"], ans: "poverty" },
        { q: "He studied ______ to understand how the human mind works.", options: ["psychiatry", "refugee", "motive", "biology"], ans: "psychiatry" },
        { q: "Being ______ in interviews builds trust.", options: ["truthful", "mature", "groupthink", "rich"], ans: "truthful" },
        { q: "A severe shortage of food caused by disaster is called ______.", options: ["famine", "ethnic", "envy", "disgust"], ans: "famine" },
        { q: "Relating to a particular race of people is called ______.", options: ["ethnic", "grassroots", "feminine", "environment"], ans: "ethnic" }
    ];

    let currentMode = ''; 
    let quizData = [];
    let wrongAnswers = []; 
    let pointsHistory = []; 
    let currentIndex = 0;
    let score = 0;
    let isAnswered = false;
    let playerName = "";

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function startQuiz(mode) {
        const nameInput = document.getElementById('player-name').value.trim();
        if (!nameInput) {
            alert("請先輸入你的名字喔！🐹");
            return;
        }
        playerName = nameInput;

        currentMode = mode;
        currentIndex = 0;
        score = 0;
        pointsHistory = []; 
        
        if (mode === 'vocab') {
            wrongAnswers = []; 
            quizData = shuffle([...vocabList]);
        } else if (mode === 'paper') {
            wrongAnswers = []; 
            quizData = shuffle([...paperList]);
        } else if (mode === 'review') {
            quizData = [...wrongAnswers];
            wrongAnswers = []; 
        }

        document.getElementById('player-display').innerText = playerName;
        showScreen('quiz-screen');
        loadQuestion();
    }

    function loadQuestion() {
        if (currentIndex >= quizData.length) {
            endQuiz();
            return;
        }

        isAnswered = false;
        const data = quizData[currentIndex];
        const uiQuestion = document.getElementById('question-display');
        const uiOptions = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');

        document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${quizData.length}`;
        document.getElementById('score-text').innerText = `Score: ${score}`;
        nextBtn.style.visibility = 'hidden';
        
        if (currentIndex > 0) prevBtn.style.visibility = 'visible';
        else prevBtn.style.visibility = 'hidden';

        uiOptions.innerHTML = '';

        if (data.zh) {
            uiQuestion.innerText = data.en;
            let options = [{ text: data.zh, correct: true }];
            while (options.length < 4) {
                let randomItem = vocabList[Math.floor(Math.random() * vocabList.length)];
                if (!options.some(o => o.text === randomItem.zh)) {
                    options.push({ text: randomItem.zh, correct: false });
                }
            }
            renderButtons(shuffle(options), 'vocab');
        } else {
            uiQuestion.innerText = data.q;
            let options = data.options.map(opt => ({
                text: opt,
                correct: opt === data.ans
            }));
            renderButtons(shuffle(options), 'paper');
        }
    }

    function renderButtons(options, type) {
        const container = document.getElementById('options-container');
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            btn.onclick = () => checkAnswer(btn, opt.correct, type);
            container.appendChild(btn);
        });
    }

    function checkAnswer(btn, isCorrect, type) {
        if (isAnswered) return;
        isAnswered = true;

        const allBtns = document.querySelectorAll('.option-btn');
        const currentQ = quizData[currentIndex];

        if (isCorrect) {
            btn.classList.add('correct');
            score++;
            pointsHistory[currentIndex] = 1; 
        } else {
            btn.classList.add('wrong');
            pointsHistory[currentIndex] = 0; 
            
            if (!wrongAnswers.includes(currentQ)) {
                wrongAnswers.push(currentQ);
            }

            allBtns.forEach(b => {
                if (type === 'vocab') {
                   if(b.innerText === currentQ.zh) b.classList.add('correct');
                } else {
                   if(b.innerText === currentQ.ans) b.classList.add('correct');
                }
            });
        }
        
        document.getElementById('score-text').innerText = `Score: ${score}`;

        allBtns.forEach(b => b.disabled = true);
        document.getElementById('next-btn').style.visibility = 'visible';
    }

    function nextQuestion() {
        currentIndex++;
        loadQuestion();
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            let prevPoints = pointsHistory[currentIndex - 1];
            if (prevPoints === 1) score--;
            currentIndex--;
            loadQuestion();
        }
    }

    function endQuiz() {
        showScreen('result-screen');
        document.getElementById('final-score').innerText = `${score} / ${quizData.length}`;
        document.getElementById('result-player-name').innerText = `玩家：${playerName}`;

        let msg = "";
        let pct = quizData.length > 0 ? score / quizData.length : 0;
        if (pct === 1) msg = "哇！太厲害了！完全勝利！🎉";
        else if (pct >= 0.8) msg = "很棒耶！差一點點就滿分了！✨";
        else if (pct >= 0.6) msg = "還不錯喔！繼續加油！💪";
        else msg = "別灰心，再一次挑戰吧！🥺";
        document.getElementById('feedback-msg').innerText = msg;

        // ** 重點：呼叫 Firebase 上傳函數 **
        if (window.uploadScore) {
            window.uploadScore(playerName, score, quizData.length, currentMode);
        }

        const reviewBtn = document.getElementById('review-btn');
        let uniqueWrong = [...new Set(wrongAnswers)];
        
        if (uniqueWrong.length > 0) {
            reviewBtn.style.display = 'inline-block';
            reviewBtn.innerText = `🐹 重做錯題 (${uniqueWrong.length}題)`;
            wrongAnswers = uniqueWrong; 
        } else {
            reviewBtn.style.display = 'none';
        }
    }

    function startReviewMode() {
        startQuiz('review');
    }

    function goHome() {
        showScreen('home-screen');
    }

    function confirmHome() {
        if (confirm("確定要回到首頁嗎？目前的測驗進度會消失喔！")) {
            goHome();
        }
    }

    function restartCurrentQuiz() {
        if (currentMode === 'review') {
             alert("複習模式結束，將回到首頁選擇新的挑戰！");
             goHome();
        } else {
            startQuiz(currentMode);
        }
    }

    function showFirebaseLeaderboard() {
        showScreen('leaderboard-screen');
        if (window.fetchLeaderboard) {
            window.fetchLeaderboard();
        }
    }

</script>

</body>
</html>
